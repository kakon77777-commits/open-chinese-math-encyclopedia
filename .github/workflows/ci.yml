name: OCME CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Rebuild formula derivatives
        run: npm run compile:formulas

      - name: Ensure generated formula data is committed
        run: git diff --exit-code -- public/data/mko

      - name: Run OCME checks
        run: npm run check
